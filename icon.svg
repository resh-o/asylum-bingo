<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF4E9"/>
      <stop offset=".55" stop-color="#FCE3C6"/>
      <stop offset="1" stop-color="#F4A774"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2C35B"/>
      <stop offset="1" stop-color="#E8794A"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="256" cy="320" r="150"/></clipPath>
    <clipPath id="sunClip"><rect x="0" y="0" width="512" height="330"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- sun with bingo grid -->
  <g clip-path="url(#sunClip)">
    <circle cx="256" cy="320" r="150" fill="url(#sun)"/>
    <g stroke="#FBF4E9" stroke-width="7" opacity=".55" clip-path="url(#disc)">
      <line x1="181" y1="160" x2="181" y2="330"/>
      <line x1="256" y1="160" x2="256" y2="330"/>
      <line x1="331" y1="160" x2="331" y2="330"/>
      <line x1="100" y1="245" x2="412" y2="245"/>
    </g>
  </g>
  <!-- birds -->
  <path d="M120 120 q14 -12 28 0 q14 -12 28 0" fill="none" stroke="#123C46" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M370 92 q10 -9 20 0 q10 -9 20 0" fill="none" stroke="#123C46" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- sea -->
  <path d="M0 330 C 60 305, 120 355, 180 330 S 300 305, 360 330 S 470 355, 512 330 V512 H0 Z" fill="#2D7D86"/>
  <path d="M0 390 C 70 365, 130 415, 200 390 S 320 365, 390 390 S 480 410, 512 392 V512 H0 Z" fill="#1E5C66"/>
  <path d="M0 450 C 80 428, 150 472, 230 450 S 360 428, 430 450 S 495 466, 512 455 V512 H0 Z" fill="#123C46"/>
  <!-- glints -->
  <g stroke="#FCE3C6" stroke-width="6" stroke-linecap="round" opacity=".8">
    <line x1="210" y1="355" x2="302" y2="355"/>
    <line x1="232" y1="375" x2="280" y2="375"/>
  </g>
</svg>
